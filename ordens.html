<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark" data-theme="escuro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordens de serviço - UnC Reparos Automotivos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <script src="js/tema.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg app-navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-wrench-adjustable"></i> UnC Reparos Automotivos</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Painel</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="ordens.html">Ordens de serviço</a></li>
                    <li class="nav-item"><a class="nav-link" href="clientes.html">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="veiculos.html">Veículos</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="revisoes.html">Revisões</a></li>
                </ul>
                <button type="button" id="btn-tema" class="btn btn-outline-secondary btn-sm ms-lg-3 mt-2 mt-lg-0 align-self-start" aria-label="Alternar tema"><i class="bi bi-sun"></i> <span class="d-lg-none">Alternar tema</span></button>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
            <h1 class="h2 mb-0">Ordens de serviço</h1>
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalOrdem"><i class="bi bi-plus-lg"></i> Nova ordem de serviço</button>
        </div>

        <section class="card">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Nº</th>
                            <th>Cliente</th>
                            <th>Veículo</th>
                            <th>Status</th>
                            <th>Total</th>
                            <th class="text-end">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-ordens"></tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Formulário de abertura e edição -->
    <div class="modal fade" id="modalOrdem" tabindex="-1" aria-labelledby="tituloModalOrdem">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="tituloModalOrdem">Nova ordem de serviço</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <form class="row g-3" id="form-ordem">
                        <div class="col-md-6">
                            <label for="cliente" class="form-label">Cliente</label>
                            <select id="cliente" name="cliente" class="form-select" required></select>
                        </div>
                        <div class="col-md-6">
                            <label for="veiculo" class="form-label">Veículo</label>
                            <select id="veiculo" name="veiculo" class="form-select" required disabled></select>
                        </div>
                        <div class="col-md-4">
                            <label for="km" class="form-label">Km de entrada</label>
                            <input type="number" id="km" name="km" class="form-control" min="0" step="1" required>
                        </div>
                        <div class="col-md-8">
                            <label for="problema" class="form-label">Problema relatado</label>
                            <textarea id="problema" name="problema" class="form-control" rows="2" minlength="10" required placeholder="Ex.: barulho ao frear e pedal baixo"></textarea>
                        </div>

                        <div class="col-12">
                            <label for="item-catalogo" class="form-label">Serviços e peças</label>
                            <div class="input-group">
                                <select id="item-catalogo" class="form-select"></select>
                                <input type="number" id="item-quantidade" class="form-control flex-grow-0" style="width: 5.5rem" value="1" min="1" step="1" aria-label="Quantidade">
                                <button type="button" class="btn btn-outline-primary" id="btn-adicionar-item"><i class="bi bi-plus-lg"></i> Adicionar</button>
                            </div>
                            <div class="table-responsive mt-2">
                                <table class="table table-sm align-middle mb-0">
                                    <thead><tr><th>Item</th><th class="text-end">Qtd.</th><th class="text-end">Valor</th><th></th></tr></thead>
                                    <tbody id="itens-ordem"></tbody>
                                </table>
                            </div>
                        </div>

                        <div class="col-md-4">
                            <label for="desconto" class="form-label">Desconto (%)</label>
                            <input type="number" id="desconto" name="desconto" class="form-control" min="0" max="15" step="1" value="0">
                            <div class="form-text">De 0% a 15%.</div>
                        </div>
                        <div class="col-md-8">
                            <div class="card card-body bg-body-tertiary" id="orcamento" aria-live="polite"></div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" form="form-ordem" class="btn btn-primary" id="btn-salvar-ordem" disabled>Abrir OS</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="border-top py-3 mt-5">
        <div class="container text-body-secondary small">UnC Reparos Automotivos · Desenvolvimento Web I</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/validacao.js"></script>
    <script src="js/ordens.js"></script>
</body>
</html>
