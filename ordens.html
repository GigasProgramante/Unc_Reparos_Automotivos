    <link href="css/style.css" rel="stylesheet">

<body class="bg-body-tertiary">
    <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-wrench-adjustable"></i> UnC Reparos Automotivos</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Painel</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="ordens.html">Ordens de serviço</a></li>
                    <li class="nav-item"><a class="nav-link" href="clientes.html">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="veiculos.html">Veículos</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="revisoes.html">Revisões</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
            <h1 class="h2 mb-0">Ordens de serviço</h1>
            
        </div>

        <section class="card">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Nº</th>
                            <th>Cliente</th>
                            <th>Veículo</th>
                            <th>Status</th>
                            <th>Total</th>
                            <th class="text-end">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-ordens">
                        <tr>
                            <td colspan="6" class="text-center text-body-secondary py-5">
                                <i class="bi bi-clipboard-check fs-1"></i>
                                <p class="mb-0">Nenhuma ordem de serviço cadastrada</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <a href="#nova-ordem" class="btn btn-primary mt-2"><i class="bi bi-plus-lg"></i> Nova ordem de serviço</a>

        <div class="d-flex flex-wrap row py-4">
            <section class="col-lg-7">
                <div class="card h-100">
                    <div class="card-header fw-semibold">Nova ordem de serviço</div>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item placeholder-glow">
                                <div class="mb-3">
                                    <label for="inputCliente" class="form-label">Cliente</label>
                                    <input
                                        type="text"
                                        name="Cliente"
                                        id="inputCliente"
                                        class="form-control"
                                    />
                                </div>
                            </li>
                            <li class="list-group-item placeholder-glow">
                                <div class="mb-3">
                                    <label for="inputCliente" class="form-label">Veículo</label>
                                    <input
                                        type="text"
                                        name="Cliente"
                                        id="inputCliente"
                                        class="form-control"
                                    />
                                </div>
                            </li>
                            <li class="list-group-item placeholder-glow">
                                <div class="mb-3">
                                    <label for="inputCliente" class="form-label">Status</label>
                                    <input
                                        type="text"
                                        name="Cliente"
                                        id="inputCliente"
                                        class="form-control"
                                    />
                                </div>
                            </li>
                            <li class="list-group-item placeholder-glow">
                                <div class="mb-3">
                                    <label for="inputCliente" class="form-label">Total</label>
                                    <input
                                        type="text"
                                        name="Cliente"
                                        id="inputCliente"
                                        class="form-control"
                                    />
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </section>
        </div>

    <footer class="border-top py-3 mt-5">
        <div class="container text-body-secondary small">UnC Reparos Automotivos · Desenvolvimento Web I</div>
